name: warehouse_mobile
description: Warehouse Mobile App v2 - MVP gudang (offline-first).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  google_sign_in: ^7.0.0

  # Pemindaian barcode (VS-1). ML Kit bundled: tetap jalan tanpa jaringan
  # setelah APK dipasang; ukuran bertambah ~3-10 MB.
  mobile_scanner: ^7.5.0

  # Tombol "Buka setelan" saat izin kamera ditolak (VS1-02).
  app_settings: ^9.0.1

  # Penyimpanan lokal (NFR-SEC-02: SQLCipher, kunci di Keystore)
  # Dipin tepat: 3.4.x menuntut Dart >= 3.9 (Flutter >= 3.35), sedangkan CI
  # memakai Flutter 3.32.5 (Dart 3.8). Pin juga membuat mesin SQLCipher sama
  # di semua mesin - format file database tidak boleh berbeda antar device.
  sqflite_sqlcipher: 3.3.0
  sqflite_common: ^2.5.4
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0

  # VS2-03: flush outbox & cycle-count saat app di background.
  workmanager: 0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    # Satu-satunya sumber skema; dibaca saat runtime agar tidak ada duplikasi SQL.
    - sqlite_schema.sql
