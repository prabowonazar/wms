name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.5'
  NODE_VERSION: '20'

jobs:
  app:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      # Mesin dev VS-0 belum punya Flutter, jadi pubspec.lock dihasilkan di CI
      # lalu diunduh dan di-commit agar versi paket terkunci untuk semua mesin.
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Folder app/android/ belum di-commit (dibuat oleh Flutter SDK). Job ini
      # membuatnya sementara agar build tetap terbukti. Begitu app/android/
      # di-commit dari mesin dev, langkah ini otomatis dilewati.
      # Catatan: ini smoke build - minSdk/ProGuard/manifest final diatur di
      # runbook-vs0.md section 3 dan harus dibuktikan di device.
      - name: Scaffold Android platform (sementara)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org wms --project-name fasco _scaffold
            cp -r _scaffold/android ./android
            rm -rf _scaffold
            # PRD menargetkan Android 8.0+ (minSdk 26). Default Flutter 21 dan
            # firebase-auth 23.2.1 menolak manifest merger di bawah 23.
            if [ -f android/app/build.gradle.kts ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
            else
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle
            fi
            # mobile_scanner 7.x minta compileSdk 36; plugin Firebase dan NDK
            # minta 27.0.12077973. Semua versi tinggi ini backward compatible.
            if [ -f android/app/build.gradle.kts ]; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
              sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
              # androidx.camera 1.6.x (dipakai mobile_scanner) menuntut AGP 8.9.1.
              # Gradle 8.12 dari template Flutter 3.32.5 sudah memenuhi syarat.
              sed -i 's/id("com.android.application") version "[0-9.]*"/id("com.android.application") version "8.9.1"/' android/settings.gradle.kts
              grep -n 'com.android.application' android/settings.gradle.kts
            fi
            grep -Rn "minSdk\|compileSdk\|ndkVersion" android/app/build.gradle* | head -8
            # Nama aplikasi di launcher tetap "Gudang", bukan "fasco".
            if [ -f android/app/src/main/AndroidManifest.xml ]; then
              sed -i 's/android:label="[^"]*"/android:label="Gudang"/' android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Cache Android debug keystore (SHA-1 stabil antar run)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Pastikan debug keystore ada & tampilkan SHA-1
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          echo "=== SHA-1 debug keystore CI (daftarkan di Firebase) ==="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
            | grep 'SHA1'

      - name: Build
        env:
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_MESSAGING_SENDER_ID: ${{ secrets.FB_MESSAGING_SENDER_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.FB_STORAGE_BUCKET }}
        run: |
          # Tanpa secret, pakai nilai dummy agar smoke build tetap hijau.
          PROJECT_ID="${FB_PROJECT_ID:-demo-warehouse}"
          API_KEY="${FB_API_KEY:-demo-api-key}"
          APP_ID="${FB_APP_ID:-1:000000000000:android:demo}"
          SENDER_ID="${FB_MESSAGING_SENDER_ID:-000000000000}"
          CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-demo.apps.googleusercontent.com}"
          STORAGE_BUCKET="${FB_STORAGE_BUCKET:-}"

          echo "BUILD_CONFIG project=$PROJECT_ID oauth=$([ -n "$CLIENT_ID" ] && echo set || echo empty)"

          flutter build apk --debug \
            --dart-define=FB_PROJECT_ID="$PROJECT_ID" \
            --dart-define=FB_API_KEY="$API_KEY" \
            --dart-define=FB_APP_ID="$APP_ID" \
            --dart-define=FB_MESSAGING_SENDER_ID="$SENDER_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$CLIENT_ID" \
            --dart-define=FB_STORAGE_BUCKET="$STORAGE_BUCKET"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Build APK demo (tanpa login, data contoh)
        run: |
          flutter build apk --debug \
            --dart-define=DEMO_MODE=true \
            --dart-define=FB_PROJECT_ID=demo-warehouse \
            --dart-define=FB_API_KEY=demo-api-key \
            --dart-define=FB_APP_ID=1:000000000000:android:demo \
            --dart-define=FB_MESSAGING_SENDER_ID=000000000000 \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=demo.apps.googleusercontent.com

      - name: Upload APK demo
        uses: actions/upload-artifact@v4
        with:
          name: app-demo-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  functions:
    name: Functions syntax & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Syntax check
        run: node --check index.js

      - name: Unit test
        run: node --test test/

  rules:
    name: Firestore rules test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install test dependencies
        working-directory: firebase/test
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13

      - name: Run rules test against emulator
        working-directory: firebase
        run: firebase emulators:exec --only firestore --project demo-warehouse "node --test test/"
